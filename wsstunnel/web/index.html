<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>wsstunnel - Web 终端</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; touch-action: manipulation; }
  #terminal { width: 100vw; height: 100vh; padding: 8px; }
  /* 移动端：手势交给 JS 统一处理，避免浏览器抢占后 touchmove 被 cancel。
     必须直接覆盖 .xterm-viewport / .xterm-screen：iOS Safari 与微信 WebView
     不会沿祖先链传播 touch-action，可滚动的 viewport 会抢走手势做原生滚动，
     导致 JS 收不到 touchmove（手指滑动"翻不动"的根因）。 */
  #terminal,
  #terminal .xterm,
  #terminal .xterm-viewport,
  #terminal .xterm-screen { touch-action: none; }
  #terminal .xterm { height: 100%; }
  #terminal .xterm-viewport { height: 100% !important; }
  #top-bar {
    position: fixed; top: 0; right: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; z-index: 10;
  }
  #status {
    font: 12px monospace;
    background: #e74c3c; color: #fff;
    padding: 4px 10px;
    border-radius: 4px;
  }
  #status.connected { background: #2ecc71; }
  #version { font: 11px monospace; color: #5a6a85; }

  #connect-form {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; gap: 16px;
    font-family: system-ui, sans-serif;
    color: #ccc;
  }
  #connect-form input, #connect-form button {
    padding: 10px 16px; font-size: 16px;
    border: 1px solid #444; border-radius: 6px;
    background: #16213e; color: #eee; width: 320px;
  }
  #connect-form button {
    background: #0f3460; color: #fff;
    cursor: pointer; font-weight: bold;
  }
  #connect-form button:hover { background: #1a4a8a; }
  .hidden { display: none !important; }
  #error { color: #e74c3c; font-size: 14px; }
  #clear-btn {
    position: fixed; bottom: 10px; right: 10px;
    background: #333; color: #999; border: none;
    border-radius: 4px; padding: 4px 10px;
    font: 12px system-ui, sans-serif;
    cursor: pointer; z-index: 20;
    opacity: 0.5; transition: opacity 0.2s;
  }
  #clear-btn:hover { opacity: 1; color: #fff; }

  /* ── 文件传输 ── */
  #file-btn {
    font: 12px monospace;
    background: #0f3460; color: #aaa;
    border: 1px solid #0f3460; border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }
  #file-btn:hover { color: #fff; }
  #file-btn.dl { background: #2c3e50; }
  #file-info {
    position: fixed; bottom: 40px; right: 10px;
    background: #1a1a2e; color: #ccc;
    border: 1px solid #333; border-radius: 6px;
    padding: 8px 14px; font: 12px monospace; z-index: 20;
    display: none; max-width: 400px;
  }
  #file-info .progress {
    margin-top: 4px; height: 4px; background: #333; border-radius: 2px;
  }
  #file-info .progress-bar {
    height: 100%; background: #2ecc71; border-radius: 2px; transition: width 0.3s;
  }

  /* 悬浮按键组：▲ / ⌨ / ▼ 竖排在一个容器里，整组定位。
     修复（v1.0.13）：旧版把 ⌨ 用 visualViewport 顶到"可视区垂直中央"，
     而 ▲ 是 fixed bottom:238px —— 键盘一弹，可视区变矮，两者正好叠在一起，
     ⌨ 的 z-index 更高，点 ▲ 实际点到 ⌨，于是"翻页键点击无反应"。
     现在整组内部用 flex 排布，物理上不可能重叠。
     v1.0.14：整组回到"屏幕垂直中央"——键盘只占底部，居中不会被遮挡。 */
  #fab-group {
    display: none;
    position: fixed; right: 12px;
    top: 50%; margin-top: -82px;   /* 组高 3×48 + 2×10 = 164，取其半 */
    flex-direction: column; align-items: center; gap: 10px;
    z-index: 41;
    pointer-events: none;          /* 容器本身不挡终端，只有按钮接管点击 */
  }
  @media (pointer: coarse), (hover: none), (max-width: 768px) {
    #fab-group { display: flex; }
  }
  #page-up, #page-down, #fab {
    pointer-events: auto;
    width: 48px; height: 48px; flex: 0 0 auto;
    border-radius: 50%;
    padding: 0; margin: 0;
    display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none; appearance: none;
    font-size: 16px; line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    transition: opacity 0.2s, background 0.2s;
  }
  /* 翻页键：几乎透明，不遮挡内容 */
  #page-up, #page-down {
    background: rgba(13, 40, 70, 0.30);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.50);
    opacity: 0.26;
  }
  #page-up:active, #page-down:active,
  #page-up.paging, #page-down.paging {
    opacity: 0.85;
    background: rgba(30, 90, 160, 0.55);
  }
  #fab {
    background: #0f3460; color: #ccc;
    border: 2px solid #1a4a8a;
    font-size: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    opacity: 0.32;
  }
  #fab:active { opacity: 0.85; }
  #fab.active { opacity: 0.85; background: #1a4a8a; }
  /* 翻不动时的轻提示（已到顶 / 已到底） */
  #page-hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 20%; padding: 6px 14px; border-radius: 14px;
    background: rgba(0,0,0,0.72); color: #eee;
    font: 12px system-ui, sans-serif; z-index: 60;
    opacity: 0; transition: opacity 0.18s; pointer-events: none;
    white-space: nowrap;
  }
  #page-hint.show { opacity: 1; }

  #fab-panel {
    display: none;
    position: fixed; right: 68px;
    top: 40vh;               /* 打开时由 positionFabPanel() 依据按键组位置重算 */
    background: rgba(26, 26, 46, 0.95);
    border: 1px solid #333; border-radius: 12px;
    padding: 10px; gap: 6px; z-index: 39;
    flex-direction: column;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #fab-panel.show { display: flex; }
  #fab-panel .row {
    display: flex; justify-content: center; gap: 5px;
  }
  #fab-panel button {
    font: 13px system-ui, sans-serif;
    background: #0f3460; color: #ccc;
    border: 1px solid #333; border-radius: 8px;
    padding: 6px 6px; cursor: pointer; min-width: 38px;
    flex: 1; min-height: 48px; text-align: center; font-size: 14px;
  }
  /* 一行 7 键（Esc/A/E/U/K/PgUp/PgDn）：窄屏靠缩小最小宽度兜住 */
  #fab-panel .row.wide button { min-width: 30px; padding: 6px 3px; font-size: 12px; }
  #fab-panel button:active { background: #1a4a8a; color: #fff; }
  #fab-panel button.active { background: #e74c3c; color: #fff; border-color: #e74c3c; }
  #fab-panel .label { color: #888; font-size: 10px; padding: 6px 2px; }

  /* ── 集群面板 ── */
  #cluster-btn {
    font: 12px monospace;
    background: #0f3460; color: #aaa;
    border: 1px solid #0f3460; border-radius: 4px;
    padding: 4px 8px; cursor: pointer;
  }
  #cluster-btn:hover { color: #fff; }
  #cluster-btn.active { background: #1a4a8a; color: #fff; }
  #cluster-panel {
    position: fixed; top: 0; right: 0;
    width: 380px; height: 100vh;
    background: #1a1a2e; border-left: 1px solid #333;
    z-index: 30; display: flex; flex-direction: column;
    font: 13px/1.5 system-ui, sans-serif; color: #ccc;
  }
  #cluster-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid #333;
    font-weight: bold; color: #fff;
  }
  #cluster-close {
    background: none; border: none; color: #666; font-size: 16px;
    cursor: pointer; padding: 2px 6px;
  }
  #cluster-close:hover { color: #fff; }
  #cluster-body { flex: 1; overflow-y: auto; padding: 10px 12px; }
  #cluster-table {
    width: 100%; border-collapse: collapse; margin-bottom: 16px;
  }
  #cluster-table th {
    text-align: left; padding: 6px 8px;
    border-bottom: 1px solid #333; color: #888; font-size: 11px;
    text-transform: uppercase;
  }
  #cluster-table td {
    padding: 6px 8px; border-bottom: 1px solid #222;
    font-family: Menlo, Monaco, monospace; font-size: 12px;
  }
  #cluster-table .name { color: #eee; }
  #cluster-table .mode {
    color: #888; font-size: 11px;
  }
  #cluster-table .status-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 4px;
  }
  #cluster-table .status-dot.online { background: #2ecc71; }
  #cluster-table .status-dot.offline { background: #e74c3c; }
  .cluster-section {
    margin-bottom: 12px;
  }
  .cluster-section h4 {
    font-size: 11px; color: #888; text-transform: uppercase;
    margin-bottom: 8px; letter-spacing: 1px;
  }
  .cluster-row {
    display: flex; gap: 6px;
  }
  .cluster-row input,
  .cluster-row select {
    flex: 1; padding: 6px 8px; font-size: 12px;
    background: #16213e; color: #eee;
    border: 1px solid #333; border-radius: 4px; outline: none;
    font-family: Menlo, Monaco, monospace;
  }
  .cluster-row input:focus { border-color: #0f3460; }
  .cluster-row button {
    padding: 6px 12px; font-size: 12px;
    background: #0f3460; color: #eee;
    border: none; border-radius: 4px; cursor: pointer;
    white-space: nowrap;
  }
  .cluster-row button:hover { background: #1a4a8a; }
  .cluster-row select { cursor: pointer; }
</style>
</head>
<body>

<div id="top-bar">
  <span id="status">Disconnected</span>
  <span id="version" title="页面版本（若与仓库版本不符说明浏览器用了缓存）">v1.0.14</span>
  <button id="cluster-btn" class="hidden">📊 集群</button>
  <button id="file-btn" class="hidden">📁 上传</button>
</div>

<!-- 连接表单 -->
<div id="connect-form">
  <h2>🔌 wsstunnel</h2>
  <input id="server-url" type="text" placeholder="wss://your-vps:443" value="" />
  <input id="token-input" type="text" placeholder="token (可选)" value="" />
  <button id="connect-btn">连接</button>
  <div id="error"></div>
</div>

<!-- 终端 -->
<div id="terminal" class="hidden"></div>

<!-- 集群面板 -->
<div id="cluster-panel" class="hidden">
  <div id="cluster-header">
    <span>📊 集群仪表板</span>
    <button id="cluster-close">✕</button>
  </div>
  <div id="cluster-body">
    <table id="cluster-table">
      <thead><tr><th>后端</th><th>模式</th><th>运行时间</th><th>状态</th></tr></thead>
      <tbody id="cluster-tbody"></tbody>
    </table>
    <div class="cluster-section">
      <h4>@all 批量命令</h4>
      <div class="cluster-row">
        <input id="cluster-all-input" placeholder="发送给全部后端…" />
        <button id="cluster-all-btn">全部执行</button>
      </div>
    </div>
    <div class="cluster-section">
      <h4>当前后端</h4>
      <div class="cluster-row">
        <select id="cluster-current-select"><option>—</option></select>
      </div>
    </div>
    <div class="cluster-section">
      <h4>单独发送</h4>
      <div class="cluster-row">
        <select id="cluster-single-select"><option>—</option></select>
        <input id="cluster-single-input" placeholder="命令…" />
        <button id="cluster-single-btn">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 移动端浮窗控制键 -->
<!-- 悬浮按键组：▲ / ⌨ / ▼ 竖排，整组定位，内部永不重叠（v1.0.13 修复重叠吞点击） -->
<div id="fab-group" role="group" aria-label="终端辅助按键">
  <button type="button" id="page-up" title="向上翻页" aria-label="向上翻页">▲</button>
  <button type="button" id="fab" title="更多按键" aria-label="更多按键">⌨</button>
  <button type="button" id="page-down" title="向下翻页" aria-label="向下翻页">▼</button>
</div>
<div id="page-hint" aria-live="polite"></div>
<div id="fab-panel">
  <div class="row">
    <button data-key="escape">Esc</button>
    <button data-key="a">A↰</button>
    <button data-key="e">E↱</button>
    <button data-key="u">U</button>
    <button data-key="k">K</button>
  </div>
  <div class="row">
    <!-- 翻页的冗余入口：万一悬浮键在某个 WebView 里失灵，这里一定可点 -->
    <button data-key="page-up" title="向上翻页">PgUp</button>
    <button data-key="page-down" title="向下翻页">PgDn</button>
  </div>
  <div class="row">
    <button data-key="tab">Tab</button>
    <button data-key="c">C</button>
    <button data-key="d">D</button>
    <button data-key="l">L</button>
    <button data-key="r">R</button>
    <button data-key="enter">↵</button>
  </div>
  <div class="row">
    <button data-key="arrow-left">←</button>
    <button data-key="arrow-up">↑</button>
    <button data-key="arrow-right">→</button>
    <button id="fab-copy-all" data-key="copy-all" title="复制全屏">📋</button>
    <button data-key="pipe">│</button>
    <button id="fab-copy-out" data-key="copy-out" title="复制本行">📄</button>
  </div>
  <div class="row" style="margin-top:1px">
    <button data-key="shift-tab" title="Shift+Tab">⇧⇥</button>
    <button data-key="arrow-down">↓</button>
    <button data-key="space" style="flex:2" title="空格">␣</button>
    <button data-key="hyphen" title="连字符">-</button>
    <button data-key="install-reasonix" title="一键安装 reasonix">⚡</button>
  </div>
</div>

<!-- 文件信息提示 -->
<div id="file-info">
  <div id="file-info-text"></div>
  <div class="progress"><div class="progress-bar" id="file-progress-bar"></div></div>
</div>

<!-- 隐藏的文件选择器 -->
<input type="file" id="file-input" style="display:none" />

<!-- 清除存储按钮 -->
<button id="clear-btn">清除</button>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

<script>
let ws = null;
let term = null;
let backends = [];
let _mobileDup = '';
let _mobileDupTimer = null;
let _mobileBuf = '';

// ── xterm 缓冲区兼容层 ──
// xterm 5.x: term.buffer 是 IBufferNamespace，真正的内容在 .active / .normal / .alternate
// xterm 4.x: term.buffer 就是 IBuffer 本体，没有 .active
// 旧代码直接写 term.buffer.active.type —— 一旦 CDN 缓存/回退到 4.x，
// 这里会抛 TypeError，事件处理器静默失败，表现就是"翻页键点击无反应"。
function activeBuffer() {
  if (!term || !term.buffer) return null;
  return term.buffer.active || term.buffer;
}
function bufferType() {
  const b = activeBuffer();
  return b ? b.type : 'normal';
}

function mobileSend(text) {
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  // 移动端也在缓冲中检测 dl 命令
  _mobileBuf += text;
  if (text === '\r' || text === '\n') {
    const line = _mobileBuf.replace('\r', '').replace('\n', '').trim();
    _mobileBuf = '';
    if (line.startsWith('dl ')) {
      const path = line.substring(3).trim();
      if (path) {
        ws.send(`dl ${path}`);
        // 设置 _mobileDup 让 onData 跳过这个换行
        _mobileDup = text;
        clearTimeout(_mobileDupTimer);
        _mobileDupTimer = setTimeout(() => { _mobileDup = ''; }, 300);
        return;
      }
    }
    if (line.startsWith('cd ') || line === 'cd') {
      const dir = line === 'cd' ? '~' : line.substring(3).trim();
      ws.send(`__CWD:${dir}`);
    }
  }
  _mobileDup = text;
  clearTimeout(_mobileDupTimer);
  _mobileDupTimer = setTimeout(() => { _mobileDup = ''; }, 300);
  ws.send(new TextEncoder().encode(text));
}

// --- localStorage 持久化 ---
const STORAGE_SERVER = 'wsstunnel_server';
const STORAGE_TOKEN = 'wsstunnel_token';

function loadStoredConfig() {
  const s = localStorage.getItem(STORAGE_SERVER);
  const t = localStorage.getItem(STORAGE_TOKEN);
  if (s) document.getElementById('server-url').value = s;
  if (t) document.getElementById('token-input').value = t;
}

function saveConfig(server, token) {
  if (server) localStorage.setItem(STORAGE_SERVER, server);
  if (token) localStorage.setItem(STORAGE_TOKEN, token);
}

function clearConfig() {
  localStorage.removeItem(STORAGE_SERVER);
  localStorage.removeItem(STORAGE_TOKEN);
  document.getElementById('server-url').value = '';
  document.getElementById('token-input').value = '';
  // 如果已连接则断开，回到表单
  if (ws) ws.close();
}

document.getElementById('clear-btn').addEventListener('click', clearConfig);

// --- 读取默认值：URL 参数优先，否则从 localStorage ---
const params = new URLSearchParams(window.location.search);
const hasUrlServer = !!params.get('server');
const hasUrlToken = !!params.get('token');

if (hasUrlServer) {
  document.getElementById('server-url').value = params.get('server');
} else {
  // 页面由 relay 自己提供时，自动推导 WebSocket 地址
  const loc = window.location;
  const wsProto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  document.getElementById('server-url').value = wsProto + '//' + loc.host + '/wsstunnel';
}
if (hasUrlToken) document.getElementById('token-input').value = params.get('token');

if (!hasUrlServer && !hasUrlToken) {
  loadStoredConfig();
}

function setStatus(text, connected) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = connected ? 'connected' : '';
}

function showError(msg) {
  document.getElementById('error').textContent = msg;
}

function connect() {
  let url = document.getElementById('server-url').value.trim();
  const token = document.getElementById('token-input').value.trim();

  if (!url) { showError('请输入服务器地址'); return; }
  // 统一 WebSocket 协议
  if (url.startsWith('https://')) url = 'wss://' + url.slice(8);
  else if (url.startsWith('http://')) url = 'ws://' + url.slice(7);
  else if (!url.includes('://') && !url.startsWith('ws://') && !url.startsWith('wss://')) url = 'wss://' + url;
  if (token && !url.includes('?token=')) url += (url.includes('?') ? '&' : '?') + 'token=' + token;

  showError('');
  document.getElementById('connect-form').classList.add('hidden');
  setStatus('连接中...');

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    const _connectedAt = Date.now();
    _reconnectAttempt = 0;
    if (_reconnectTimer) { clearTimeout(_reconnectTimer); _reconnectTimer = null; }
    setStatus('已连接', true);
    clearInterval(window._uptimeTimer);
    clearInterval(window._pingTimer);   // 防重连后残留旧心跳
    window._uptimeTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - _connectedAt) / 1000);
      const text = sec < 60 ? `已连接 ↑${sec}s` : sec < 3600 ? `已连接 ↑${Math.floor(sec/60)}m` : `已连接 ↑${Math.floor(sec/60/60)}h`;
      setStatus(text, true);
    }, 10000);
    // 应用层保活心跳（25s < 常见反代 60s 空闲超时），防长连接被切断
    window._pingTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('__PING__');
    }, 25000);
    // 连接成功后保存配置到 localStorage
    saveConfig(document.getElementById('server-url').value.trim(), token);
    initTerminal();
    // 连接成功后获取后端列表
    setTimeout(() => ws.send('LIST'), 300);
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      handleRelayText(e.data);
    } else {
      if (term) term.write(new Uint8Array(e.data));
    }
    // 保持焦点：如果用户在面板输入框中，不抢焦点
    const panelInputs = ['cluster-all-input', 'cluster-single-input'];
    if (term && term.textarea && document.activeElement !== term.textarea
        && !panelInputs.includes(document.activeElement?.id)) {
      term.textarea.focus();
    }
  };

  // ── 自动重连 ──
  let _reconnectAttempt = 0;
  let _reconnectTimer = null;

  ws.onclose = () => {
    clearInterval(window._uptimeTimer);
    clearInterval(window._listTimer);
    clearInterval(window._pingTimer);
    setStatus('已断开');

    if (term) {
      term.dispose();
      term = null;
    }

    // 自动重连（指数退避，最大 30s）
    _reconnectAttempt++;
    const delay = Math.min(1000 * Math.pow(2, _reconnectAttempt - 1), 30000);
    setStatus(`重连中 (${_reconnectAttempt}次, ${delay/1000}s)...`);
    _reconnectTimer = setTimeout(() => {
      const savedServer = localStorage.getItem(STORAGE_SERVER);
      const savedToken = localStorage.getItem(STORAGE_TOKEN);
      if (savedServer) {
        document.getElementById('server-url').value = savedServer;
        if (savedToken) document.getElementById('token-input').value = savedToken;
        connect();
      } else {
        document.getElementById('connect-form').classList.remove('hidden');
      }
    }, delay);
  };

  ws.onerror = () => {
    showError('连接失败，请检查地址和网络');
    setStatus('连接失败');
    ws.close();
  };
}

// 处理 relay 文本回复
function handleRelayText(text) {
  // 文件传输数据（下载方向）拦截，不写终端
  if (handleFileData(text)) return;
  // 后端列表更新（静默，不写终端）
  if (text.startsWith('[Info] Connected backends:')) {
    const firstLine = text.split('\n')[0];  // 只取第一行，忽略 [Info] Current:
    const listStr = firstLine.split(':').slice(1).join(':').trim();
    backends = listStr.split(',').map(s => s.trim()).filter(s => s);
    return;  // 静默更新 backends，不写终端
  }
  // 切换后端确认
  if (text.startsWith('[Info] Switched to backend:')) {
    const name = text.split(':').slice(1).join(':').trim().split('(')[0].trim();
    // 切换确认仅在终端显示
  }
  // 其他文本回复写入终端
  if (term) term.write(text + '\r\n');
}

function initTerminal() {
  document.getElementById('terminal').classList.remove('hidden');
  document.getElementById('file-btn').classList.remove('hidden');

  term = new Terminal({
    cursorBlink: true,
    cursorStyle: 'block',
    fontSize: 14,
    // 显式给足回滚历史：默认值极小或被他处覆盖时，翻页键会"一动不动"
    scrollback: 5000,
    fontFamily: 'Menlo, Monaco, "Fira Code", monospace',
    theme: {
      background: '#1a1a2e',
      foreground: '#e0e0e0',
      cursor: '#ffffff',
      selectionBackground: '#334466',
      black: '#282a36',
      red: '#ff5555',
      green: '#50fa7b',
      yellow: '#f1fa8c',
      blue: '#6272a4',
      magenta: '#ff79c6',
      cyan: '#8be9fd',
      white: '#f8f8f2',
    },
  });

  term.open(document.getElementById('terminal'));

  // 自适应容器大小
  function fitTerminal() {
    const el = document.getElementById('terminal');
    if (!el.clientHeight || !el.clientWidth) return setTimeout(fitTerminal, 100);
    // 尝试从 xterm 内部获取真实字符尺寸（最精确）
    let cw, ch;
    try {
      const dims = term._core?._renderService?.dimensions;
      if (dims?.actualCellWidth > 0 && dims?.actualCellHeight > 0) {
        cw = dims.actualCellWidth;
        ch = dims.actualCellHeight;
      }
    } catch {}
    // 回退：从 DOM 测量实际行高
    if (!ch) {
      const row = el.querySelector('.xterm-rows > div');
      if (row) {
        ch = row.clientHeight;
        cw = row.clientWidth / Math.max(1, term.cols);
      }
    }
    // 最终回退：根据字号估算
    if (!ch) { cw = 8.4; ch = 17; }
    const padding = 16;
    const cols = Math.max(20, Math.floor((el.clientWidth - padding) / cw));
    const rows = Math.max(5, Math.floor((el.clientHeight - padding) / ch));
    // 键盘开合也会触发 resize：xterm 重排后视口会被拉回底部，
    // 刚点 ▲ 翻上去的内容瞬间"弹回去" —— 用户看到的就是按键没反应。
    // 记下视口顶端所在的行，重排后还回到那一行（不在底部时）。
    const before = activeBuffer();
    const atBottom = !before || before.viewportY >= before.baseY;
    const keepTopLine = before ? before.viewportY : 0;
    term.resize(cols, rows);
    if (before && !atBottom) {
      term.scrollToLine(keepTopLine);
    }
    // 强制 viewport 撑满容器（xterm 内联样式无法用 CSS 覆盖）
    const vp = el.querySelector('.xterm-viewport');
    if (vp) vp.style.height = el.clientHeight + 'px';
  }
  fitTerminal();

  // 窗口大小变化 → __RESIZE
  const sendResize = () => {
    fitTerminal();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(`__RESIZE:${term.rows},${term.cols}`);
    }
  };

  term.onResize(sendResize);
  window.addEventListener('resize', sendResize);
  setTimeout(sendResize, 500);

  // ── 命令行输入缓冲：用于拦截 dl 等特殊命令 ──
  let _inputBuf = '';

  // 所有输入（键盘、IME 中文、粘贴）统一通过 xterm 的 onData 处理
  // 移动端去重：compositionend/paste 兜底可能先于 onData 发送
  term.onData((data) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    // 缓冲输入（放在 _mobileDup 检查之前，确保移动端也能积累）
    _inputBuf += data;
    if (data && data === _mobileDup) { _mobileDup = ''; return; }

    if (data === '\r' || data === '\n') {
      const line = _inputBuf.replace('\r', '').replace('\n', '').trim();
      _inputBuf = '';
      // dl <path> → 走文本通道，不走 PTY
      if (line.startsWith('dl ')) {
        const path = line.substring(3).trim();
        if (path) {
          ws.send(`dl ${path}`);
          return;
        }
      }
      // cd <dir> → 通知后端追踪当前目录（不写 PTY，避免重复执行）
      if (line.startsWith('cd ') || line === 'cd') {
        const dir = line === 'cd' ? '~' : line.substring(3).trim();
        ws.send(`__CWD:${dir}`);
      }
    }
    // 正常输入：二进制发送
    ws.send(new TextEncoder().encode(data));
  });

  // 移动端兜底：iOS 中文键盘用 insertText（非 insertFromComposition）
  if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
    term.textarea.addEventListener('beforeinput', (e) => {
      // 处理各种输入：普通按键、中文输入法、换行键
      if (e.inputType === 'insertLineBreak') {
        mobileSend('\n');
      } else if (e.data && (e.inputType === 'insertText' || e.inputType === 'insertFromComposition')) {
        mobileSend(e.data);
      }
    });
    term.textarea.addEventListener('paste', (e) => {
      const text = (e.clipboardData || window.clipboardData).getData('text/plain');
      if (text) mobileSend(text);
    });
  }

  // 移动端触摸滚动（xterm 自身不处理手指滑动）
  enableTouchScroll();
}

// 移动端触摸滚动：手指下滑看更早的输出，上滑看更新的内容
function enableTouchScroll() {
  const el = document.getElementById('terminal');
  if (!el || el.dataset.touchScroll === '1') return;  // 重连后避免重复绑定
  el.dataset.touchScroll = '1';

  const cellHeight = () => {
    try {
      // xterm 5.x: dimensions = {css:{cell:{height}}, device:{...}}
      // （旧版 4.x 才是顶层 actualCellHeight，5.x 取不到会退回 17px 误差）
      const d = term && term._core?._renderService?.dimensions;
      const h = d?.css?.cell?.height || d?.device?.cell?.height || d?.actualCellHeight;
      if (h > 0) return h;
    } catch {}
    // 内部 API 变动时的兜底：直接从 DOM 量真实行高
    const row = document.querySelector('#terminal .xterm-rows > div');
    return (row && row.clientHeight) || 17;
  };

  let startY = 0, applied = 0, moved = false;

  el.addEventListener('touchstart', (e) => {
    if (!term || e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    applied = 0;
    moved = false;
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    if (!term || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (!moved && Math.abs(dy) < 6) return;  // 轻触放行，保证点击聚焦弹键盘
    moved = true;
    if (e.cancelable) e.preventDefault();
    // 手指下滑(dy > 0) = 往更早的内容翻 = 负行数；上滑 = 往更新的内容翻
    const target = Math.trunc(-dy / cellHeight());
    if (target !== applied) {
      term.scrollLines(target - applied);
      applied = target;
    }
  }, { passive: false });

  el.addEventListener('touchend', () => { moved = false; applied = 0; }, { passive: true });
  el.addEventListener('touchcancel', () => { moved = false; applied = 0; }, { passive: true });
}

// 键盘 PageUp/PageDown：本地翻回滚历史。
// 默认 xterm 会把它们转成 ESC[5~/ESC[6~ 发给远端——裸 bash 无人处理，
// 反而把视口拉回底部（scrollOnUserInput），所以必须在捕获阶段截住。
// 全屏程序（vim/less/tmux）走备屏，翻页由远端负责，放行。
function enableKeyboardPaging() {
  document.addEventListener('keydown', (e) => {
    if (!term || (e.key !== 'PageUp' && e.key !== 'PageDown')) return;
    const t = e.target;
    if (t && t.tagName === 'INPUT') return;          // 服务器地址/token 输入框不抢
    // 本地没有可翻的历史（备屏 / baseY 为 0）就放行，让 xterm 把
    // ESC[5~/ESC[6~ 发给远端 vim/less/tmux
    if (!canScrollLocally()) return;
    e.preventDefault();
    e.stopPropagation();
    const moved = scrollPage(e.key === 'PageUp' ? -1 : 1);
    if (!moved) pageHint(e.key === 'PageUp' ? 'top' : 'bottom');
  }, true);  // capture：必须早于 xterm textarea 的 keydown
}

// 本地翻一页；返回是否真的移动了（已到顶/底时为 false）
function scrollPage(dir) {
  const before = activeBuffer();
  if (!before) return false;
  const y0 = before.viewportY;
  try {
    if (typeof term.scrollPages === 'function') {
      term.scrollPages(dir);
    } else {
      term.scrollLines(dir * Math.max(1, term.rows - 1));
    }
  } catch (e) {
    // 个别 xterm 版本 scrollPages 不存在/签名不同，退回 scrollLines
    try { term.scrollLines(dir * Math.max(1, term.rows - 1)); } catch (e2) { return false; }
  }
  const after = activeBuffer();
  return !!after && after.viewportY !== y0;
}

// 这一页到底该由谁翻？
// - 备屏（vim/less/top/tmux）：交给远端，本地翻不动
// - 正常缓冲但还没有回滚历史（baseY 为 0）：本地也翻不动，回退给远端
// - xterm 4.x 没有 buffer.type，用 baseY 判断同样成立（备屏 baseY 恒为 0）
function canScrollLocally() {
  const b = activeBuffer();
  if (!b) return false;
  if (b.type === 'alternate') return false;
  return (b.baseY || 0) > 0;
}

// 翻不动时给个明确反馈，避免"点了完全没反应"的错觉
let _hintTimer = null;
function pageHint(where) {
  const el = document.getElementById('page-hint');
  if (!el) return;
  el.textContent = where === 'top' ? '已到最顶部（没有更早的输出）'
    : where === 'bottom' ? '已到最底部'
    : '当前没有可翻的历史，已把翻页键发给远端';
  el.classList.add('show');
  clearTimeout(_hintTimer);
  _hintTimer = setTimeout(() => el.classList.remove('show'), 1400);
}

enableKeyboardPaging();

// ── 文件传输 ──
let _downloadState = null; // {b64path, path, size, chunks:[], received, idx}

// UTF-8 安全的 base64 编解码（btoa/atob 不支持中文）
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}
function b64decode(str) {
  try {
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder().decode(bytes);
  } catch(e) {
    return str;
  }
}

function showFileInfo(text, pct) {
  const el = document.getElementById('file-info');
  document.getElementById('file-info-text').textContent = text;
  document.getElementById('file-progress-bar').style.width = Math.min(pct, 100) + '%';
  el.style.display = 'block';
  if (pct >= 100) {
    setTimeout(() => { el.style.display = 'none'; }, 3000);
  }
}

function handleFileData(text) {
  // __FILE_OK:{b64path}:{size} — 上传确认（忽略，不触发下载）
  if (text.startsWith('__FILE_OK:')) {
    return true;
  }
  // __FILE_DONE:{b64path}:{size} — 上传完成
  if (text.startsWith('__FILE_DONE:')) {
    const parts = text.split(':');
    let path = '';
    try { path = b64decode(parts[1]); } catch(e) { path = parts[1]; }
    showFileInfo(`✅ 上传完成: ${path} (${parts[2]} bytes)`, 100);
    return true;
  }
  // __FILE_BEGIN:{b64path}:{size} — 下载开始
  if (text.startsWith('__FILE_BEGIN:')) {
    const parts = text.split(':');
    const b64path = parts[1];
    const size = parseInt(parts[2], 10);
    let path = '';
    try { path = b64decode(b64path); } catch(e) { path = b64path; }
    _downloadState = { b64path, path, size, chunks: [], received: 0, idx: 0 };
    showFileInfo(`📥 下载: ${path} (${size} bytes)`, 0);
    return true;
  }
  // __FILE_CHUNK:{b64path}:{idx}:{b64data} — 数据块
  if (text.startsWith('__FILE_CHUNK:')) {
    if (!_downloadState) return true; // 没有对应下载，静默忽略
    const parts = text.split(':');
    const idx = parseInt(parts[2], 10);
    try {
      const data = Uint8Array.from(atob(parts[3]), c => c.charCodeAt(0));
      _downloadState.chunks[idx] = data;
      _downloadState.received += data.length;
      const pct = Math.round(_downloadState.received / _downloadState.size * 100);
      showFileInfo(`📥 下载: ${_downloadState.path} (${_downloadState.received}/${_downloadState.size})`, pct);
    } catch(e) { /* ignore parse errors */ }
    return true;
  }
  // __FILE_END:{b64path}:{size} — 下载完成
  if (text.startsWith('__FILE_END:')) {
    if (!_downloadState) return true;
    // 组装所有块
    const totalLen = _downloadState.chunks.reduce((s, c) => s + (c ? c.length : 0), 0);
    const result = new Uint8Array(totalLen);
    let offset = 0;
    for (const chunk of _downloadState.chunks) {
      if (chunk) { result.set(chunk, offset); offset += chunk.length; }
    }
    // 触发浏览器下载
    const blob = new Blob([result]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = _downloadState.path.split('/').pop() || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showFileInfo(`✅ 下载完成: ${_downloadState.path} (${totalLen} bytes)`, 100);
    _downloadState = null;
    return true;
  }
  // __FILE_ERROR:{b64path}:{msg} — 下载失败
  if (text.startsWith('__FILE_ERROR:')) {
    const parts = text.split(':');
    const msg = parts.slice(2).join(':');
    showFileInfo(`❌ 下载失败: ${msg}`, 0);
    _downloadState = null;
    return true;
  }
  return false;
}

// ── 文件上传 ──
document.getElementById('file-btn').addEventListener('click', function() {
  document.getElementById('file-input').click();
});

document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file || !ws || ws.readyState !== WebSocket.OPEN) return;

  // 上传到后端当前目录
  const path = file.name;
  const b64path = b64encode(path);
  const size = file.size;
  const chunkSize = 65536;

  showFileInfo(`📤 上传: ${file.name} → ${path} (${size} bytes)`, 0);

  // 发送开始
  ws.send(`__FILE_BEGIN:${b64path}:${size}`);

  // 分块读取并发送
  const reader = new FileReader();
  let offset = 0;
  let idx = 0;
  let sent = 0;

  function readNext() {
    const slice = file.slice(offset, offset + chunkSize);
    if (slice.size === 0) {
      // 发送结束
      ws.send(`__FILE_END:${b64path}`);
      showFileInfo(`✅ 上传完成: ${file.name} (${sent} bytes)`, 100);
      return;
    }
    reader.onload = function(ev) {
      const data = new Uint8Array(ev.target.result);
      // 手动遍历转 binary（避免 apply 传参超 65536 限制）
      let binary = '';
      for (let i = 0; i < data.length; i++) {
        binary += String.fromCharCode(data[i]);
      }
      const b64data = btoa(binary);
      ws.send(`__FILE_CHUNK:${b64path}:${idx}:${b64data}`);
      idx++;
      sent += data.length;
      offset += data.length;
      const pct = Math.round(sent / size * 100);
      showFileInfo(`📤 上传: ${file.name} → ${path} (${sent}/${size})`, pct);
      setTimeout(readNext, 10);  // 避免阻塞 UI
    };
    reader.readAsArrayBuffer(slice);
  }

  readNext();
  this.value = '';  // 重置，允许再次选择同一文件
});

// ── 移动端浮窗控制键 ──
function fabSend(key) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  let bytes;
  if (key === 'escape') bytes = [0x1b];
  else if (key === 'tab') bytes = [0x09];
  else if (key === 'shift-tab') bytes = [0x1b, 0x5b, 0x5a];
  else if (key === 'enter') bytes = [0x0d];
  else if (key === 'space') bytes = [0x20];
  else if (key === 'pipe') bytes = [0x7c];
  else if (key === 'hyphen') bytes = [0x2d];
  else if (key === 'install-reasonix') {
    const cmd = 'npm i -g reasonix code && reasonix setup\r';
    ws.send(new TextEncoder().encode(cmd));
    return;
  }
  else if (key === 'page-up' || key === 'page-down') {
    // 翻页分两种场景，别一律把 ESC[5~/ESC[6~ 丢给远端：
    // - 备屏（less/vim/top/tmux 等全屏程序）：翻页由远端程序负责，发按键；
    // - 正常缓冲（裸 bash 提示符）：本地有回滚历史就翻本地，否则才发按键。
    //   本地翻不动时必须回退为“发按键”—— 否则在 tmux/less 里、或 xterm
    //   判定不了备屏（旧版本没有 buffer.type）时，就是干瞪眼一动不动。
    if (canScrollLocally()) {
      const moved = scrollPage(key === 'page-up' ? -1 : 1);
      if (moved) return;             // 本地翻成功，不必打扰远端
      pageHint(key === 'page-up' ? 'top' : 'bottom');
      return;
    }
    // 备屏不提示（远端程序会翻）；正常缓冲但没历史时给一句说明
    const b = activeBuffer();
    if (!b || b.type !== 'alternate') pageHint('empty');
    bytes = key === 'page-up' ? [0x1b, 0x5b, 0x35, 0x7e] : [0x1b, 0x5b, 0x36, 0x7e];
  }
  else if (key === 'arrow-up') bytes = [0x1b, 0x5b, 0x41];
  else if (key === 'arrow-down') bytes = [0x1b, 0x5b, 0x42];
  else if (key === 'arrow-left') bytes = [0x1b, 0x5b, 0x44];
  else if (key === 'arrow-right') bytes = [0x1b, 0x5b, 0x43];
  else {
    const code = key.toUpperCase().charCodeAt(0) - 64;
    if (code >= 1 && code <= 26) {
      bytes = [code];
    }
  }
  if (bytes) {
    ws.send(new Uint8Array(bytes));
  }
}

// ── 悬浮按键：▲ / ⌨ / ▼ ──
// 面板跟随按键组定位（不再写死 50vh，避免键盘弹出后飘出屏幕）
function positionFabPanel() {
  const group = document.getElementById('fab-group');
  const panel = document.getElementById('fab-panel');
  if (!group || !panel) return;
  const r = group.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  const ph = panel.offsetHeight || 220;
  // 面板右对齐在按键组左侧，垂直方向尽量与按键组顶部对齐且不超出屏幕
  const top = Math.min(Math.max(8, r.top + r.height / 2 - ph / 2), Math.max(8, vh - ph - 8));
  panel.style.top = Math.round(top) + 'px';
}

document.getElementById('fab').addEventListener('click', function() {
  const panel = document.getElementById('fab-panel');
  const opening = !this.classList.contains('active');
  this.classList.toggle('active');
  panel.classList.toggle('show');
  if (opening) positionFabPanel();
  // 打开面板时收起系统键盘，关闭时恢复
  if (term && term.textarea) {
    if (opening) term.textarea.blur();
    else setTimeout(() => term.textarea.focus(), 100);
  }
});

// 每个键独立节流：旧版是全局 300ms，连点 ▲ 后立刻点 ▼ 会被吞掉，
// 用户体感就是"点了没反应"。改成每键 180ms，互不影响。
const _fireAt = { 'page-up': 0, 'page-down': 0 };
function flashPageBtn(key) {
  const el = document.getElementById(key);
  if (!el) return;
  el.classList.add('paging');
  clearTimeout(el._flashTimer);
  el._flashTimer = setTimeout(() => el.classList.remove('paging'), 220);
}
function firePage(key) {
  const now = Date.now();
  if (now - (_fireAt[key] || 0) < 180) return;
  _fireAt[key] = now;
  flashPageBtn(key);
  fabSend(key);
}

for (const key of ['page-up', 'page-down']) {
  const el = document.getElementById(key);
  if (!el) continue;
  // pointerdown 比 click 更早、不受 300ms 延迟与双击缩放影响
  el.addEventListener('pointerdown', (e) => {
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();
    firePage(key);
  }, { passive: false });
  el.addEventListener('click', (e) => { e.stopPropagation(); firePage(key); });
}

// 坐标兜底：微信 X5 偶尔吞掉 fixed 元素的元素级事件。
// 在 document 上按触摸坐标找最近的翻页键（热区半径 32px），
// 取"最近的那个"，两键热区不重叠时也不会误判到相邻键。
document.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  let bestKey = null, bestD = Infinity;
  for (const key of ['page-up', 'page-down']) {
    const el = document.getElementById(key);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (!r.width) continue;                       // 未显示（桌面端）
    const dx = t.clientX - (r.left + r.width / 2);
    const dy = t.clientY - (r.top + r.height / 2);
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; bestKey = key; }
  }
  if (bestKey && bestD <= 32 * 32) {
    if (e.cancelable) e.preventDefault();
    firePage(bestKey);
  }
}, { passive: false });

document.getElementById('fab-panel').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  const key = btn.dataset.key;
  if (key === 'copy-out' || key === 'copy-all') {
    let text = '';
    const buf = activeBuffer();
    if (!buf) return;
    if (key === 'copy-all') {
      for (let i = 0; i < buf.length; i++) {
        text += (buf.getLine(i)?.translateToString() || '') + '\n';
      }
    } else {
      // 复制最后一行（当前编辑行）
      text = buf.getLine(buf.length - 1)?.translateToString() || '';
    }
    if (navigator.clipboard && text) {
      navigator.clipboard.writeText(text);
    }
    return;
  }
  if (key === 'page-up' || key === 'page-down') {
    firePage(key);                     // 复用节流 + 按下反馈 + 到顶/到底提示
  } else {
    fabSend(key);
  }
  // 不收起面板，方便连续点击
});

// 点击面板外自动收起
document.addEventListener('click', function(e) {
  const panel = document.getElementById('fab-panel');
  const fab = document.getElementById('fab');
  if (!panel.classList.contains('show')) return;
  if (!panel.contains(e.target) && !fab.contains(e.target)) {
    fab.classList.remove('active');
    panel.classList.remove('show');
  }
});

// ── 悬浮按键组：始终待在“可视区垂直中央” ──
// 键盘只占屏幕底部，居中不会被遮挡；键盘弹出时可视区变矮，
// 按 visualViewport 重新居中即可（整组一起动，内部间距由 flex 保证）。
(function() {
  const group = document.getElementById('fab-group');
  if (!group) return;
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function placeGroup() {
    const vv = window.visualViewport;
    if (!vv) return;
    const gh = group.offsetHeight || 164;
    // iOS 的 fixed 以视觉视口为基准；Android Chrome 以布局视口为基准，需补 offsetTop
    const base = isIOS ? 0 : vv.offsetTop;
    const top = base + Math.max(4, (vv.height - gh) / 2);
    group.style.top = Math.round(top) + 'px';
    group.style.marginTop = '0px';
    group.style.bottom = 'auto';
    const panel = document.getElementById('fab-panel');
    if (panel && panel.classList.contains('show')) positionFabPanel();
  }
  window.visualViewport?.addEventListener('resize', placeGroup);
  window.visualViewport?.addEventListener('scroll', placeGroup);
  window.addEventListener('resize', placeGroup);
  placeGroup();
})();

// ── 集群面板 ──
let _listTimer = null;

function escHtml(s) {
  // HTML 转义：后端名来自远端客户端（不可信输入），插入 DOM 前必须转义
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderCluster() {
  const tbody = document.getElementById('cluster-tbody');
  const cur = document.getElementById('cluster-current-select');
  const sel = document.getElementById('cluster-single-select');
  tbody.innerHTML = backends.map(b => {
    const current = b.endsWith(' *');
    const display = current ? b.slice(0, -2).trim() : b;
    const uptime = display.match(/ ↑([^ ]+)/)?.[1] || '';
    const clean = display.replace(/ ↑[^ ]+/, '');
    const name = clean.replace(/\s*\([^)]*\)$/, '');
    const mode = clean.match(/\(([^)]+)\)/)?.[1] || '?';
    return `<tr>
      <td class="name">${current ? '<b>' : ''}${escHtml(name)}${current ? '</b>' : ''}</td>
      <td class="mode">${escHtml(mode)}</td>
      <td>${escHtml(uptime) || '—'}</td>
      <td><span class="status-dot online"></span></td>
    </tr>`;
  }).join('');
  const names = backends.map(b => {
    return b.replace(/ ↑[^ ]+/, '').replace(/\s*\*$/, '').replace(/\s*\([^)]*\)$/, '').trim();
  });
  const currentName = backends.some(b => b.endsWith(' *'))
    ? names[backends.findIndex(b => b.endsWith(' *'))]
    : names[0] || '';
  cur.innerHTML = names.map(n =>
    `<option value="${escHtml(n)}" ${n === currentName ? 'selected' : ''}>${escHtml(n)}</option>`
  ).join('');
  sel.innerHTML = names.map(n => `<option value="${escHtml(n)}">${escHtml(n)}</option>`).join('');
  document.getElementById('cluster-btn').classList.remove('hidden');

  // 恢复上次保存的后端选择
  const saved = localStorage.getItem('wsstunnel_backend');
  if (saved && names.includes(saved) && saved !== currentName && ws && ws.readyState === WebSocket.OPEN) {
    ws.send('USE ' + saved);
  }
}

function stripBackendName(b) {
  return b.replace(/ ↑[^ ]+/, '').replace(/\s*\*$/, '').replace(/\s*\([^)]*\)$/, '').trim();
}

// 监听后端列表更新（handleRelayText 已更新 backends）
const _origHandle = handleRelayText;
handleRelayText = function(text) {
  _origHandle(text);
  if (text.startsWith('[Info] Connected backends:')) {
    renderCluster();
    clearInterval(_listTimer);
    _listTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('LIST');
    }, 10000);
  }
};

document.getElementById('cluster-btn').addEventListener('click', function() {
  const p = document.getElementById('cluster-panel');
  const opening = p.classList.contains('hidden');
  p.classList.toggle('hidden');
  this.classList.toggle('active');
  if (opening && ws && ws.readyState === WebSocket.OPEN) ws.send('LIST');
});
document.getElementById('cluster-close').addEventListener('click', function() {
  document.getElementById('cluster-panel').classList.add('hidden');
  document.getElementById('cluster-btn').classList.remove('active');
});

// @all 批量执行
document.getElementById('cluster-all-btn').addEventListener('click', function() {
  const cmd = document.getElementById('cluster-all-input').value.trim();
  if (!cmd || !ws || ws.readyState !== WebSocket.OPEN) return;
  backends.forEach((b, i) => {
    const name = b.replace(/ ↑[^ ]+/, '').replace(/\s*\*$/, '').replace(/\s*\([^)]*\)$/, '').trim();
    setTimeout(() => ws.send(`@${name} echo "==== ${name} ====" && ${cmd}`), i * 200);
  });
  document.getElementById('cluster-all-input').value = '';
  term.write(`\r\n╔════ @all: ${cmd} ═══════════════╗\r\n`);
});
document.getElementById('cluster-all-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('cluster-all-btn').click();
});

// 切换当前后端
document.getElementById('cluster-current-select').addEventListener('change', function() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send('USE ' + this.value);
    localStorage.setItem('wsstunnel_backend', this.value);
  }
});

// 单独发送
document.getElementById('cluster-single-btn').addEventListener('click', function() {
  const sel = document.getElementById('cluster-single-select');
  const cmd = document.getElementById('cluster-single-input').value.trim();
  if (!sel.value || !cmd || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(`@${sel.value} ${cmd}`);
  document.getElementById('cluster-single-input').value = '';
  term.write(`\r\n📡 @${sel.value}: ${cmd}\r\n`);
});
document.getElementById('cluster-single-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('cluster-single-btn').click();
});

// 自动连接：URL 有参数，或 localStorage 有值时
const serverField = document.getElementById('server-url').value;
const tokenField = document.getElementById('token-input').value;
if (hasUrlServer || hasUrlToken || (serverField && tokenField)) {
  setTimeout(connect, 300);
}

document.getElementById('connect-btn').addEventListener('click', connect);
document.getElementById('server-url').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connect();
});
document.getElementById('token-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connect();
});
</script>
